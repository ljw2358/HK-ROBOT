<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HK Robot Fleet - Daily Revenue Settlement System</title>
    <style>
        :root {
            --bg-color: #0f172a;
            --card-bg: #1e293b;
            --accent-color: #3b82f6;
            --green: #22c55e;
            --text-main: #f8fafc;
            --text-sub: #94a3b8;
            --border: #334155;
        }

        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', system-ui, sans-serif; }
        body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }

        /* Header & Language Dropdown */
        header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }
        .logo { font-size: 1.4rem; font-weight: bold; color: var(--accent-color); display: flex; align-items: center; gap: 8px; }
        
        .lang-select-wrapper { position: relative; }
        select.lang-select {
            background-color: var(--card-bg);
            color: var(--text-main);
            border: 1px solid var(--accent-color);
            padding: 8px 16px;
            border-radius: 8px;
            font-size: 0.95rem;
            cursor: pointer;
            outline: none;
        }

        /* Dashboard Grid */
        .grid-3 { display: grid; grid-template-columns: repeat(auto-fit, minmax(280px, 1fr)); gap: 20px; margin-bottom: 25px; }
        .card { background-color: var(--card-bg); border-radius: 12px; padding: 20px; border: 1px solid var(--border); }
        .card-title { color: var(--text-sub); font-size: 0.85rem; margin-bottom: 8px; text-transform: uppercase; }
        .card-value { font-size: 1.8rem; font-weight: bold; }
        .card-value.green { color: var(--green); }

        /* Calculator Controls */
        .controls-card { margin-bottom: 25px; }
        .control-group { display: flex; flex-direction: column; gap: 8px; margin-bottom: 15px; }
        label { font-size: 0.9rem; color: var(--text-sub); display: flex; justify-content: space-between; }
        input[type="range"] { accent-color: var(--accent-color); cursor: pointer; }
        input[type="number"] { background: var(--bg-color); border: 1px solid var(--border); color: #fff; padding: 8px; border-radius: 6px; width: 100%; }

        /* Table */
        table { width: 100%; border-collapse: collapse; text-align: left; font-size: 0.9rem; }
        th { background-color: #0f172a; color: var(--text-sub); padding: 12px; border-bottom: 1px solid var(--border); }
        td { padding: 12px; border-bottom: 1px solid var(--border); }
        .status-badge { padding: 4px 8px; border-radius: 4px; font-size: 0.75rem; background: rgba(34, 197, 94, 0.2); color: var(--green); }
    </style>
</head>
<body>

    <!-- Header with Top-Right Language Dropdown -->
    <header>
        <div class="logo">🤖 HK Robot Daily Settlement</div>
        <div class="lang-select-wrapper">
            <select class="lang-select" id="langSelect" onchange="changeLanguage()">
                <option value="en">English (영어)</option>
                <option value="zh">中文 (중국어)</option>
                <option value="ar">العربية (아랍어)</option>
                <option value="hi">हिन्दी (인도어/힌디어)</option>
                <option value="es">Español (스페인어)</option>
                <option value="pt-BR">Português (브라질어)</option>
                <option value="uk">Українська (우크라이나어)</option>
                <option value="ja">日本語 (일본어)</option>
                <option value="ru">Русский (러시아어)</option>
                <option value="vi">Tiếng Việt (베트남어)</option>
                <option value="th">ไทย (태국어)</option>
                <option value="id">Bahasa Indonesia (인도네시아어)</option>
                <option value="pa">فلسطين (팔레스타인 아랍어)</option>
                <option value="de">Deutsch (독일어)</option>
                <option value="it">Italiano (이태리어)</option>
                <option value="fr">Français (프랑스어)</option>
            </select>
        </div>
    </header>

    <!-- Daily Revenue Settlement Cards -->
    <div class="grid-3">
        <div class="card">
            <div class="card-title" id="lbl-daily-revenue">일일 총 매출</div>
            <div class="card-value" id="val-revenue">$0.00</div>
        </div>
        <div class="card">
            <div class="card-title" id="lbl-daily-cost">일일 운용/전력 비용</div>
            <div class="card-value" style="color: #ef4444;" id="val-cost">$0.00</div>
        </div>
        <div class="card">
            <div class="card-title" id="lbl-daily-profit">일일 최종 정산 순수익</div>
            <div class="card-value green" id="val-profit">$0.00</div>
        </div>
    </div>

    <!-- Parameter Controls -->
    <div class="card controls-card">
        <h3 style="margin-bottom: 15px;" id="lbl-params">정산 파라미터 설정</h3>
        
        <div class="control-group">
            <label><span id="lbl-robot-count">가동 로봇 수</span>: <b id="disp-robot-count">10</b>대</label>
            <input type="range" id="input-robots" min="1" max="100" value="10" oninput="calculate()">
        </div>

        <div class="control-group">
            <label><span id="lbl-hours">일일 가동 시간 (기체당)</span>: <b id="disp-hours">16</b>시간</label>
            <input type="range" id="input-hours" min="1" max="24" value="16" oninput="calculate()">
        </div>

        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 15px;">
            <div class="control-group">
                <label id="lbl-rate">시간당 임대/작업 단가 ($)</label>
                <input type="number" id="input-rate" value="45" oninput="calculate()">
            </div>
            <div class="control-group">
                <label id="lbl-maintenance">시간당 유지/전력비 ($)</label>
                <input type="number" id="input-maint" value="10" oninput="calculate()">
            </div>
        </div>
    </div>

    <!-- Robot Fleet Status Table -->
    <div class="card">
        <h3 style="margin-bottom: 15px;" id="lbl-fleet">개별 로봇 일일 정산 리스트</h3>
        <table>
            <thead>
                <tr>
                    <th>Robot ID</th>
                    <th id="th-model">모델</th>
                    <th id="th-hours">일일 가동시간</th>
                    <th id="th-gross">일일 매출</th>
                    <th id="th-net">정산 예정액</th>
                    <th id="th-status">상태</th>
                </tr>
            </thead>
            <tbody id="robot-table-body">
                <!-- Dynamic Rows -->
            </tbody>
        </table>
    </div>

    <script>
        // Language Labels Dictionary
        const i18n = {
            en: { revenue: "Daily Gross Revenue", cost: "Daily Operating Cost", profit: "Daily Net Settlement", params: "Settlement Parameters", count: "Active Robots", hours: "Daily Hours / Unit", rate: "Hourly Rate ($)", maint: "Hourly Cost ($)", fleet: "Robot Fleet Daily Status", model: "Model", status: "Settled" },
            zh: { revenue: "每日总收入", cost: "每日运营成本", profit: "每日净结算", params: "结算参数设置", count: "运行机器人数量", hours: "每日运行时间/台", rate: "每小时单价 ($)", maint: "每小时成本 ($)", fleet: "机器人每日结算列表", model: "型号", status: "已结算" },
            ar: { revenue: "الإيرادات اليومية الإجمالية", cost: "تكلفة التشغيل اليومية", profit: "صافي التسوية اليومية", params: "معلمات التسوية", count: "الروبوتات النشطة", hours: "ساعات العمل اليومية", rate: "السعر بالساعة ($)", maint: "التكلفة بالساعة ($)", fleet: "حالة أسطول الروبوتات", model: "النموذج", status: "مكتمل" },
            ja: { revenue: "一日総売上", cost: "一日運用/電力コスト", profit: "一日最終決済純利益", params: "決済パラメータ設定", count: "稼働ロボット数", hours: "1日稼働時間/台", rate: "時間単価 ($)", maint: "時間 costs ($)", fleet: "個別ロボット日次決済リスト", model: "モデル", status: "決済完了" },
            ko: { revenue: "일일 총 매출", cost: "일일 운용/전력 비용", profit: "일일 최종 정산 순수익", params: "정산 파라미터 설정", count: "가동 로봇 수", hours: "일일 가동 시간 (기체당)", rate: "시간당 임대/작업 단가 ($)", maint: "시간당 유지/전력비 ($)", fleet: "개별 로봇 일일 정산 리스트", model: "모델", status: "정산 완료" }
        };

        function calculate() {
            const robots = parseInt(document.getElementById('input-robots').value);
            const hours = parseInt(document.getElementById('input-hours').value);
            const rate = parseFloat(document.getElementById('input-rate').value) || 0;
            const maint = parseFloat(document.getElementById('input-maint').value) || 0;

            document.getElementById('disp-robot-count').innerText = robots;
            document.getElementById('disp-hours').innerText = hours;

            const totalGross = robots * hours * rate;
            const totalCost = robots * hours * maint;
            const netProfit = totalGross - totalCost;

            document.getElementById('val-revenue').innerText = '$' + totalGross.toLocaleString();
            document.getElementById('val-cost').innerText = '$' + totalCost.toLocaleString();
            document.getElementById('val-profit').innerText = '$' + netProfit.toLocaleString();

            renderTable(robots, hours, rate, maint);
        }

        function renderTable(robots, hours, rate, maint) {
            const tbody = document.getElementById('robot-table-body');
            tbody.innerHTML = '';

            for (let i = 1; i <= Math.min(robots, 10); i++) {
                const gross = hours * rate;
                const net = hours * (rate - maint);
                const row = `<tr>
                    <td><b>HK-FIG-${String(i).padStart(3, '0')}</b></td>
                    <td>Figure 02 Custom</td>
                    <td>${hours} hrs</td>
                    <td>$${gross.toLocaleString()}</td>
                    <td style="color:var(--green); font-weight:bold;">$${net.toLocaleString()}</td>
                    <td><span class="status-badge">Settled</span></td>
                </tr>`;
                tbody.innerHTML += row;
            }
        }

        function changeLanguage() {
            const lang = document.getElementById('langSelect').value;
            const dict = i18n[lang] || i18n['en'];

            if(dict.revenue) document.getElementById('lbl-daily-revenue').innerText = dict.revenue;
            if(dict.cost) document.getElementById('lbl-daily-cost').innerText = dict.cost;
            if(dict.profit) document.getElementById('lbl-daily-profit').innerText = dict.profit;
            if(dict.params) document.getElementById('lbl-params').innerText = dict.params;
            if(dict.count) document.getElementById('lbl-robot-count').innerText = dict.count;
            if(dict.hours) document.getElementById('lbl-hours').innerText = dict.hours;
            if(dict.rate) document.getElementById('lbl-rate').innerText = dict.rate;
            if(dict.maint) document.getElementById('lbl-maintenance').innerText = dict.maint;
            if(dict.fleet) document.getElementById('lbl-fleet').innerText = dict.fleet;
        }

        // Init
        calculate();
    </script>
</body>
</html>
