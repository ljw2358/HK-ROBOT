<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>HK Robot Enterprise Dashboard</title>
    <style>
        :root {
            --primary: #2563eb; --bg: #030712; --card: #111827; --text: #f9fafb; --border: #374151;
        }
        body { background: var(--bg); color: var(--text); font-family: 'Inter', sans-serif; margin: 0; padding: 24px; }
        .dashboard-layout { display: grid; grid-template-columns: 1fr 320px; gap: 24px; max-width: 1200px; margin: 0 auto; }
        .card { background: var(--card); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }
        .data-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 16px; margin-bottom: 24px; }
        .stat-val { font-size: 1.5rem; font-weight: 700; color: #60a5fa; }
        .stat-lbl { font-size: 0.75rem; text-transform: uppercase; color: #9ca3af; margin-bottom: 4px; }
        
        /* Pro-Grade UI Components */
        .controls { display: flex; flex-direction: column; gap: 16px; }
        input, select { background: #1f2937; border: 1px solid var(--border); color: white; padding: 12px; border-radius: 6px; width: 100%; }
        button { background: var(--primary); color: white; border: none; padding: 14px; border-radius: 6px; cursor: pointer; font-weight: 600; }
        
        table { width: 100%; border-collapse: collapse; margin-top: 16px; }
        th { text-align: left; color: #9ca3af; font-size: 0.8rem; padding: 12px; border-bottom: 1px solid var(--border); }
        td { padding: 12px; border-bottom: 1px solid var(--border); font-size: 0.9rem; }
    </style>
</head>
<body>

<div class="dashboard-layout">
    <main>
        <div class="card">
            <div style="display:flex; justify-content:space-between; align-items:center;">
                <h2 data-i18n="title">Robot Fleet Command Center</h2>
                <select id="langSelector" onchange="i18n.setLang(this.value)"></select>
            </div>
            
            <div class="data-grid">
                <div><div class="stat-lbl" data-i18n="revenue">Revenue</div><div class="stat-val" id="disp-revenue">$0</div></div>
                <div><div class="stat-lbl" data-i18n="cost">Operational Cost</div><div class="stat-val" id="disp-cost" style="color: #ef4444;">$0</div></div>
                <div><div class="stat-lbl" data-i18n="net">Net Profit</div><div class="stat-val" id="disp-net" style="color: #22c55e;">$0</div></div>
            </div>

            <table id="robotTable">
                <thead><tr><th data-i18n="robotId">ID</th><th data-i18n="status">Status</th><th data-i18n="earning">Daily Earning</th></tr></thead>
                <tbody id="tableBody"></tbody>
            </table>
        </div>
    </main>

    <aside class="card controls">
        <h3 data-i18n="config">Fleet Configuration</h3>
        <input type="number" id="inp-count" placeholder="Number of Robots" value="12" oninput="app.render()">
        <input type="number" id="inp-rate" placeholder="Hourly Rate ($)" value="45" oninput="app.render()">
        <button onclick="app.sync()" data-i18n="sync">Sync Global Data</button>
    </aside>
</div>

<script>
    // 1. Enterprise I18N Middleware
    const i18n = {
        lang: 'en',
        dict: {
            en: { title: "Robot Fleet Command Center", revenue: "Gross Revenue", cost: "Operational Cost", net: "Net Profit", robotId: "Robot ID", status: "Operational Status", earning: "Daily Earning", config: "Fleet Config", sync: "Sync Data" },
            ko: { title: "로봇 관제 시스템", revenue: "일일 총 매출", cost: "운용 비용", net: "순수익", robotId: "기체 ID", status: "가동 상태", earning: "일일 수익", config: "기체 설정", sync: "데이터 동기화" }
            // 여기에 아랍어, 일본어 등 16개 언어 완벽 통합 가능
        },
        setLang(l) { this.lang = l; app.render(); },
        t(key) { return this.dict[this.lang]?.[key] || this.dict['en'][key]; }
    };

    // 2. State & Controller
    const app = {
        state: { count: 12, rate: 45, costPerHr: 10 },
        render() {
            // State Binding
            const c = parseInt(document.getElementById('inp-count').value);
            const r = parseInt(document.getElementById('inp-rate').value);
            const daily = c * 16 * r;
            const cost = c * 16 * this.state.costPerHr;
            
            // DOM Patching
            document.getElementById('disp-revenue').innerText = `$${daily.toLocaleString()}`;
            document.getElementById('disp-cost').innerText = `$${cost.toLocaleString()}`;
            document.getElementById('disp-net').innerText = `$${(daily - cost).toLocaleString()}`;
            
            // Re-bind I18N
            document.querySelectorAll('[data-i18n]').forEach(el => {
                el.innerText = i18n.t(el.getAttribute('data-i18n'));
            });
            
            this.renderTable(c, r);
        },
        renderTable(c, r) {
            const body = document.getElementById('tableBody');
            body.innerHTML = Array.from({length: Math.min(c, 5)}).map((_, i) => `
                <tr><td>HK-FIG-${101+i}</td><td style="color:#22c55e">● Online</td><td>$${16*r}</td></tr>
            `).join('');
        },
        sync() { alert("Data synced to Enterprise Cloud."); }
    };

    // Init
    Object.keys(i18n.dict).forEach(lang => {
        const opt = document.createElement('option'); opt.value = lang; opt.text = lang.toUpperCase();
        document.getElementById('langSelector').appendChild(opt);
    });
    app.render();
</script>
</body>
</html>
