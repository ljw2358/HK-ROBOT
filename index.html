<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title id="doc-title">HK ROBOT 시스템 대시보드</title>
    <style>
        :root {
            --bg-color: #060913;
            --card-bg: rgba(15, 23, 42, 0.75);
            --card-border: #1e293b;
            --text-color: #ffffff;
            --text-secondary: #94a3b8;
            
            /* SF 네온 칼라 */
            --neon-cyan: #00f0ff;
            --neon-pink: #ff007f;
            --neon-green: #00ff88;
            --neon-purple: #a855f7;
            --neon-yellow: #ffcc00;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
        }

        body {
            background-color: var(--bg-color);
            background-image: 
                radial-gradient(circle at 10% 20%, rgba(0, 240, 255, 0.08) 0%, transparent 40%),
                radial-gradient(circle at 90% 80%, rgba(255, 0, 127, 0.08) 0%, transparent 40%);
            color: var(--text-color);
            padding: 15px;
            min-height: 100vh;
        }

        /* Header */
        .header {
            display: flex;
            flex-wrap: wrap;
            justify-content: space-between;
            align-items: center;
            gap: 12px;
            margin-bottom: 20px;
            padding: 15px;
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(0, 240, 255, 0.2);
            border-radius: 12px;
            backdrop-filter: blur(10px);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.1);
        }

        .header h1 {
            font-size: 1.2rem;
            font-weight: 800;
            letter-spacing: 1px;
            background: linear-gradient(90deg, var(--neon-cyan), var(--neon-pink));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
            text-shadow: 0 0 20px rgba(0, 240, 255, 0.4);
            white-space: nowrap;
        }

        .header-controls {
            display: flex;
            gap: 10px;
            align-items: center;
        }

        .lang-select {
            background: #0f172a;
            border: 1px solid var(--neon-cyan);
            color: var(--neon-cyan);
            padding: 6px 12px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: 600;
            outline: none;
            cursor: pointer;
            box-shadow: 0 0 10px rgba(0, 240, 255, 0.2);
        }

        .user-menu {
            background: linear-gradient(135deg, rgba(255, 0, 127, 0.2), rgba(168, 85, 247, 0.2));
            border: 1px solid var(--neon-pink);
            color: #ffffff;
            padding: 6px 14px;
            border-radius: 6px;
            font-size: 0.8rem;
            font-weight: bold;
            white-space: nowrap;
            box-shadow: 0 0 10px rgba(255, 0, 127, 0.2);
        }

        /* Grid Layout */
        .dashboard-grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }

        @media (max-width: 768px) {
            .header {
                flex-direction: column;
                align-items: flex-start;
            }
            .header-controls {
                width: 100%;
                justify-content: space-between;
            }
            .dashboard-grid {
                grid-template-columns: 1fr;
            }
        }

        .card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 20px;
            backdrop-filter: blur(12px);
        }

        /* Robot Tracking Card */
        .robot-card {
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 340px;
            position: relative;
            border: 1px solid rgba(168, 85, 247, 0.4);
            box-shadow: 0 0 25px rgba(168, 85, 247, 0.15);
        }

        .robot-title {
            position: absolute;
            top: 20px;
            left: 20px;
            font-size: 0.85rem;
            font-weight: bold;
            color: var(--neon-purple);
            letter-spacing: 1px;
            text-shadow: 0 0 8px rgba(168, 85, 247, 0.5);
        }

        .robot-circle {
            width: 190px;
            height: 190px;
            border-radius: 50%;
            border: 2px dashed var(--neon-cyan);
            background: radial-gradient(circle, rgba(255, 0, 127, 0.15) 0%, rgba(0, 240, 255, 0.1) 50%, rgba(0,0,0,0) 100%);
            display: flex;
            align-items: center;
            justify-content: center;
            position: relative;
            box-shadow: 0 0 30px rgba(0, 240, 255, 0.3), inset 0 0 20px rgba(255, 0, 127, 0.2);
            animation: rotateSphere 15s linear infinite;
        }

        @keyframes rotateSphere {
            from { transform: rotate(0deg); }
            to { transform: rotate(360deg); }
        }

        .robot-core-dot {
            width: 12px;
            height: 12px;
            background-color: var(--neon-pink);
            border-radius: 50%;
            box-shadow: 0 0 20px var(--neon-pink), 0 0 40px var(--neon-pink);
        }

        .robot-footer {
            margin-top: 25px;
            font-size: 0.85rem;
            color: var(--neon-cyan);
            font-weight: 600;
            letter-spacing: 1px;
        }

        /* Status Cards */
        .status-stack {
            display: flex;
            flex-direction: column;
            gap: 15px;
        }

        .status-card {
            background: var(--card-bg);
            border-radius: 12px;
            padding: 18px 22px;
            display: flex;
            flex-direction: column;
            justify-content: center;
            min-height: 100px;
            transition: transform 0.2s ease;
        }

        .status-card:hover {
            transform: translateY(-2px);
        }

        .card-status {
            border: 1px solid rgba(0, 255, 136, 0.4);
            box-shadow: 0 0 15px rgba(0, 255, 136, 0.15);
        }
        .card-speed {
            border: 1px solid rgba(0, 240, 255, 0.4);
            box-shadow: 0 0 15px rgba(0, 240, 255, 0.15);
        }
        .card-battery {
            border: 1px solid rgba(255, 204, 0, 0.4);
            box-shadow: 0 0 15px rgba(255, 204, 0, 0.15);
        }

        .status-label {
            font-size: 0.75rem;
            color: var(--text-secondary);
            margin-bottom: 6px;
            text-transform: uppercase;
            font-weight: 600;
            letter-spacing: 0.5px;
        }

        .status-value {
            font-size: 1.5rem;
            font-weight: 800;
        }

        .val-green {
            color: var(--neon-green);
            text-shadow: 0 0 12px rgba(0, 255, 136, 0.4);
        }

        .val-cyan {
            color: var(--neon-cyan);
            text-shadow: 0 0 12px rgba(0, 240, 255, 0.4);
        }

        .val-yellow {
            color: var(--neon-yellow);
            text-shadow: 0 0 12px rgba(255, 204, 0, 0.4);
        }
    </style>
</head>

        <div class="status-stack">
            <section class="status-card card-status">
