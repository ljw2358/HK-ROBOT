<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>HK ROBOT 시스템 대시보드</title>
  <style>
    /* 눈이 편안한 다크 모드 스타일 */
    :root {
      --bg-color: #0d1117;
      --card-bg: #161b22;
      --text-main: #e6edf3;
      --text-dim: #8b949e;
      --accent: #58a6ff;
      --border: #30363d;
      --danger: #f85149;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }

    body { background-color: var(--bg-color); color: var(--text-main); padding: 20px; }

    header { display: flex; justify-content: space-between; align-items: center; padding-bottom: 20px; border-bottom: 1px solid var(--border); margin-bottom: 20px; }

    .brand-title { font-size: 1.2rem; font-weight: 600; color: var(--accent); }

    /* 드롭다운 스타일 */
    select {
      background: var(--card-bg);
      color: var(--text-main);
      border: 1px solid var(--border);
      padding: 8px 12px;
      border-radius: 6px;
      cursor: pointer;
    }

    .dashboard-grid { display: grid; grid-template-columns: 1fr; gap: 20px; }

    .card { background: var(--card-bg); border: 1px solid var(--border); border-radius: 12px; padding: 24px; }

    .card-title { font-size: 0.9rem; color: var(--text-dim); margin-bottom: 20px; text-transform: uppercase; }

    .radar-display { width: 100%; max-width: 240px; height: 240px; border: 1px solid var(--border); border-radius: 50%; margin: 0 auto 20px; position: relative; background: rgba(88, 166, 255, 0.03); }

    .target-dot { width: 8px; height: 8px; background-color: var(--danger); border-radius: 50%; position: absolute; top: 45%; left: 60%; }

    .tracking-status { text-align: center; color: var(--text-dim); }

    .metrics-container { display: grid; gap: 15px; }

    .metric-card { background: var(--card-bg); border: 1px solid var(--border); padding: 20px; border-radius: 12px; }

    .metric-label { font-size: 0.85rem; color: var(--text-dim); margin-bottom: 8px; }

    .metric-value { font-size: 1.8rem; font-weight: 700; }

    .metric-unit { font-size: 0.9rem; color: var(--text-dim); }

    @media (min-width: 768px) { .dashboard-grid { grid-template-columns: 1fr 1fr; } }
  </style>
</head>
<body>

  <header>
    <div class="brand-title" data-i18n="headerTitle">HK ROBOT 시스템 대시보드</div>
    <!-- 17개 언어 리스트 -->
    <select onchange="changeLanguage(this.value)">
      <option value="ko">한국어</option>
      <option value="en">English</option>
      <option value="zh">中文</option>
      <option value="ar">العربية</option>
      <option value="hi">हिन्दी</option>
      <option value="es">Español</option>
      <option value="pt">Português (Brasil)</option>
      <option value="uk">Українська</option>
      <option value="ja">日本語</option>
      <option value="ru">Русский</option>
      <option value="vi">Tiếng Việt</option>
      <option value="th">ภาษาไทย</option>
      <option value="id">Bahasa Indonesia</option>
      <option value="pa">العربية (فلسطين)</option>
      <option value="de">Deutsch</option>
      <option value="it">Italiano</option>
      <option value="fr">Français</option>
    </select>
  </header>

  <main class="dashboard-grid">
    <section class="card">
      <div class="card-title" data-i18n="radarTitle">로봇 레이더 스코프</div>
      <div class="radar-display"><div class="target-dot"></div></div>
      <div class="tracking-status" data-i18n="targetLabel">추적 중: HK-ROBOT-01</div>
    </section>

    <section class="metrics-container">
      <div class="metric-card">
        <div class="metric-label" data-i18n="status">시스템 상태</div>
        <div class="metric-value">ACTIVE</div>
      </div>
      <div class="metric-card">
        <div class="metric-label" data-i18n="speed">운행 속도</div>
        <div class="metric-value">1.2 <span class="metric-unit">m/s</span></div>
      </div>
      <div class="metric-card">
        <div class="metric-label" data-i18n="power">배터리</div>
        <div class="metric-value">92 <span class="metric-unit">%</span></div>
      </div>
    </section>
  </main>

  <script>
    // 모든 언어 데이터
    const translations = {
      ko: { headerTitle: "HK ROBOT 시스템 대시보드", radarTitle: "로봇 레이더 스코프", targetLabel: "추적 중: HK-ROBOT-01", status: "시스템 상태", speed: "운행 속도", power: "배터리" },
      en: { headerTitle: "HK ROBOT DASHBOARD", radarTitle: "ROBOT RADAR", targetLabel: "TRACKING: HK-ROBOT-01", status: "SYSTEM STATUS", speed: "SPEED", power: "BATTERY" },
      zh: { headerTitle: "HK ROBOT 控制系统", radarTitle: "机器人雷达", targetLabel: "追踪中: HK-ROBOT-01", status: "系统状态", speed: "速度", power: "电池" },
      ar: { headerTitle: "نظام تحكم HK ROBOT", radarTitle: "رادار الروبوت", targetLabel: "جاري التتبع: HK-ROBOT-01", status: "حالة النظام", speed: "السرعة", power: "البطارية" },
      hi: { headerTitle: "HK ROBOT नियंत्रण प्रणाली", radarTitle: "रोबोट रडार", targetLabel: "ट्रैकिंग: HK-ROBOT-01", status: "सिस्टम स्थिति", speed: "गति", power: "बैटरी" },
      es: { headerTitle: "SISTEMA DE CONTROL HK ROBOT", radarTitle: "RADAR ROBOT", targetLabel: "RASTREANDO: HK-ROBOT-01", status: "ESTADO DEL SISTEMA", speed: "VELOCIDAD", power: "BATERÍA" },
      pt: { headerTitle: "SISTEMA DE CONTROLE HK ROBOT", radarTitle: "RADAR DO ROBÔ", targetLabel: "RASTREAMENTO: HK-ROBOT-01", status: "ESTADO DO SISTEMA", speed: "VELOCIDADE", power: "BATERIA" },
      uk: { headerTitle: "СИСТЕМА КЕРУВАННЯ HK ROBOT", radarTitle: "РАДАР РОБОТА", targetLabel: "ВІДСТЕЖЕННЯ: HK-ROBOT-01", status: "СТАН СИСТЕМИ", speed: "ШВИДКІСТЬ", power: "ЗАРЯД" },
      ja: { headerTitle: "HK ROBOT 管制システム", radarTitle: "ロボットレーダー", targetLabel: "追跡中: HK-ROBOT-01", status: "システム状態", speed: "速度", power: "バッテリー" },
      ru: { headerTitle: "СИСТЕМА УПРАВЛЕНИЯ HK ROBOT", radarTitle: "РАДАР РОБОТА", targetLabel: "ОТСЛЕЖИВАНИЕ: HK-ROBOT-01", status: "СОСТОЯНИЕ СИСТЕМЫ", speed: "СКОРОСТЬ", power: "БАТАРЕЯ" },
      vi: { headerTitle: "HỆ THỐNG ĐIỀU KHIỂN HK ROBOT", radarTitle: "RADA ROBOT", targetLabel: "THEO DÕI: HK-ROBOT-01", status: "TRẠNG THÁI", speed: "TỐC ĐỘ", power: "PIN" },
      th: { headerTitle: "ระบบควบคุม HK ROBOT", radarTitle: "เรดาร์หุ่นยนต์", targetLabel: "กำลังติดตาม: HK-ROBOT-01", status: "สถานะระบบ", speed: "ความเร็ว", power: "แบตเตอรี่" },
      id: { headerTitle: "SISTEM KONTROL HK ROBOT", radarTitle: "RADAR ROBOT", targetLabel: "PELACAKAN: HK-ROBOT-01", status: "STATUS SISTEM", speed: "KECEPATAN", power: "BATERAI" },
      pa: { headerTitle: "نظام تحكم HK ROBOT - فلسطين", radarTitle: "رادار الروبوت", targetLabel: "جاري التتبع: HK-ROBOT-01", status: "حالة النظام", speed: "السرعة", power: "البطارية" },
      de: { headerTitle: "HK ROBOT KONTROLLSYSTEM", radarTitle: "ROBOTER-RADAR", targetLabel: "VERFOLGUNG: HK-ROBOT-01", status: "SYSTEMSTATUS", speed: "GESCHWINDIGKEIT", power: "BATTERIE" },
      it: { headerTitle: "SISTEMA DI CONTROLLO HK ROBOT", radarTitle: "RADAR ROBOT", targetLabel: "TRACCIAMENTO: HK-ROBOT-01", status: "STATO SISTEMA", speed: "VELOCITÀ", power: "BATTERIA" },
      fr: { headerTitle: "SYSTÈME DE CONTRÔLE HK ROBOT", radarTitle: "RADAR ROBOT", targetLabel: "SUIVI: HK-ROBOT-01", status: "ÉTAT SYSTÈME", speed: "VITESSE", power: "BATTERIE" }
    };

    function changeLanguage(lang) {
      document.querySelectorAll('[data-i18n]').forEach(el => {
        const key = el.getAttribute('data-i18n');
        if (translations[lang] && translations[lang][key]) el.textContent = translations[lang][key];
      });
      document.body.style.direction = (lang === 'ar' || lang === 'pa') ? 'rtl' : 'ltr';
    }
  </script>
</body>
</html>
