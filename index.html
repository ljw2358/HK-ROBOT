<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>HK Global Robot Command Center | Enterprise Dashboard</title>
    <style>
        :root {
            --bg: #030712; --panel: #111827; --accent: #2563eb; --text: #f9fafb; --dim: #9ca3af;
        }
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Inter', -apple-system, sans-serif; }
        body { background: var(--bg); color: var(--text); padding: 32px; display: flex; justify-content: center; }
        
        /* Layout Structure */
        .dashboard { width: 100%; max-width: 1400px; display: grid; grid-template-columns: 300px 1fr; gap: 24px; }
        .card { background: var(--panel); border: 1px solid #1f2937; border-radius: 16px; padding: 24px; }
        .header-section { display: flex; justify-content: space-between; align-items: center; margin-bottom: 32px; }
        
        /* Stats Component */
        .stats-grid { display: grid; grid-template-columns: repeat(3, 1fr); gap: 20px; margin-bottom: 32px; }
        .stat-card { background: #0f172a; padding: 20px; border-radius: 12px; border: 1px solid #1e293b; }
        .stat-val { font-size: 1.8rem; font-weight: 700; color: #60a5fa; margin-top: 8px; }
        
        /* Table Component */
        table { width: 100%; border-collapse: collapse; margin-top: 20px; }
        th { text-align: left; color: var(--dim); font-size: 0.75rem; text-transform: uppercase; padding: 16px; border-bottom: 1px solid #1f2937; }
        td { padding: 16px; border-bottom: 1px solid #1f2937; font-size: 0.9rem; }
        
        /* Controls */
        input, select { background: #0f172a; border: 1px solid #1e293b; padding: 12px; border-radius: 8px; color: white; width: 100%; margin-bottom: 16px; }
        button { background: var(--accent); color: white; border: none; padding: 16px; border-radius: 8px; cursor: pointer; font-weight: 600; width: 100%; }
        
        .status-online { color: #22c55e; }
    </style>
</head>
<body>

<div class="dashboard">
    <!-- Sidebar Controls -->
    <aside class="card">
        <h3 data-i18n="config">Fleet Configuration</h3>
        <p style="color:var(--dim); font-size: 0.8rem; margin-bottom: 20px;">Figure-02 Operational Parameters</p>
        <label>Active Robots</label>
        <input type="number" id="inp-robots" value="12" oninput="Dashboard.update()">
        <label>Hourly Revenue Rate ($)</label>
        <input type="number" id="inp-rate" value="45" oninput="Dashboard.update()">
        <button onclick="Dashboard.sync()">Initialize Settlement</button>
    </aside>

    <!-- Main Content -->
    <main>
        <div class="header-section">
            <h1 data-i18n="title">HK Global Command Center</h1>
            <select id="langSelect" onchange="Dashboard.setLang(this.value)" style="width: 200px;"></select>
        </div>

        <div class="stats-grid">
            <div class="stat-card"><div class="stat-lbl" data-i18n="revenue">Revenue</div><div class="stat-val" id="disp-revenue">$0</div></div>
            <div class="stat-card"><div class="stat-lbl" data-i18n="cost">Op-Cost</div><div class="stat-val" id="disp-cost" style="color: #ef4444;">$0</div></div>
            <div class="stat-card"><div class="stat-lbl" data-i18n="net">Net Profit</div><div class="stat-val" id="disp-net" style="color: #22c55e;">$0</div></div>
        </div>

        <div class="card">
            <table>
                <thead>
                    <tr>
                        <th data-i18n="th-id">Robot ID</th>
                        <th data-i18n="th-status">Status</th>
                        <th data-i18n="th-earn">Daily Earning</th>
                    </tr>
                </thead>
                <tbody id="table-body"></tbody>
            </table>
        </div>
    </main>
</div>

<script>
    // 1. Enterprise Dictionary (I18N Layer)
    const Dictionary = {
        en: { title: "Global Command Center", config: "Fleet Config", revenue: "Gross Revenue", cost: "Operational Cost", net: "Net Profit", "th-id": "Asset ID", "th-status": "Network Status", "th-earn": "Daily Performance" },
        ko: { title: "글로벌 로봇 관제센터", config: "기체 설정", revenue: "총 매출", cost: "운용 비용", net: "순수익", "th-id": "기체 번호", "th-status": "네트워크 상태", "th-earn": "일일 수익" },
        ja: { title: "グローバル・ロボット管制センター", config: "艦隊設定", revenue: "総売上", cost: "運用コスト", net: "純利益", "th-id": "資産ID", "th-status": "ネットワーク状態", "th-earn": "日次パフォーマンス" },
        // ... (필요시 16개국 데이터 확장)
    };

    // 2. Dashboard Engine (MVC Controller)
    const Dashboard = {
        lang: 'ko',
        state: { robots: 12, rate: 45, maint: 10 },

        setLang(l) { this.lang = l; this.update(); },

        update() {
            this.state.robots = parseInt(document.getElementById('inp-robots').value);
            this.state.rate = parseInt(document.getElementById('inp-rate').value);
            
            const gross = this.state.robots * 16 * this.state.rate;
            const cost = this.state.robots * 16 * this.state.maint;
            
            // DOM Patching
            document.getElementById('disp-revenue').innerText = `$${gross.toLocaleString()}`;
            document.getElementById('disp-cost').innerText = `$${cost.toLocaleString()}`;
            document.getElementById('disp-net').innerText = `$${(gross - cost).toLocaleString()}`;
            
            // I18N Bind
            document.querySelectorAll('[data-i18n]').forEach(el => {
                const key = el.getAttribute('data-i18n');
                if(Dictionary[this.lang]?.[key]) el.innerText = Dictionary[this.lang][key];
            });

            this.renderTable();
        },

        renderTable() {
            const body = document.getElementById('table-body');
            body.innerHTML = Array.from({length: Math.min(this.state.robots, 6)}).map((_, i) => `
                <tr>
                    <td>HK-FIG-00${i+1}</td>
                    <td class="status-online">● Online</td>
                    <td>$${(16 * this.state.rate).toLocaleString()}</td>
                </tr>
            `).join('');
        },

        sync() { console.log("Initializing Global Settlement API..."); alert("Enterprise API Synced."); }
    };

    // 3. Init Bootstrapping
    Object.keys(Dictionary).forEach(k => {
        const opt = document.createElement('option'); opt.value = k; opt.text = k.toUpperCase();
        document.getElementById('langSelect').appendChild(opt);
    });
    Dashboard.update();
</script>
</body>
</html>
